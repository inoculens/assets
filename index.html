<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INOCULENS ASSETS — Local-First Portfolio Tracker</title>
  <meta name="description" content="INOCULENS ASSETS is a private, local-first portfolio tracker. Track buys and sells per asset with live prices, ECB-locked FX normalization, and average-cost / FIFO P&L — all stored only in your browser. No account, no server, no tracking.">
  <link rel="canonical" href="https://assets.inoculens.com/">
  <meta name="theme-color" content="#0f0f0f">

  <!-- CSP: limit outbound data fetches to CoinGecko + Frankfurter (+ Fonts).
       connect-src only: scripts/styles/images/inline handlers unrestricted,
       so file:// and static hosts keep working. -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' api.coingecko.com api.frankfurter.dev fonts.googleapis.com fonts.gstatic.com">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="INOCULENS ASSETS">
  <meta property="og:title" content="INOCULENS ASSETS — Local-First Portfolio Tracker">
  <meta property="og:description" content="Private, local-first portfolio tracker: per-asset trades, live prices, ECB FX locks, average-cost and FIFO P&L. Your data never leaves your browser.">
  <meta property="og:url" content="https://assets.inoculens.com/">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="INOCULENS ASSETS — Local-First Portfolio Tracker">
  <meta name="twitter:description" content="Private, local-first portfolio tracker with live prices, ECB-locked FX, and average-cost / FIFO P&L. No account, no server.">

  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "INOCULENS ASSETS",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Web",
    "description": "Private, local-first portfolio tracker: track buys and sells per asset with live prices, ECB-locked FX normalization, and average-cost / FIFO P&L. All data stays in your browser.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
    "url": "https://assets.inoculens.com/"
  }
  </script>
</head>
<body>
  <header class="brand">
    <div class="brand-inner topbar">
      <div class="brand-id">
        <h1>INOCULENS <span>ASSETS</span></h1>
      </div>
      <div class="topbar-controls">
        <label class="tb-field" for="tb-main"><span class="tb-label">Currency</span>
          <select id="tb-main">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
            <option value="CHF">CHF</option>
          </select>
        </label>
        <div class="segmented" role="group" aria-label="Cost method">
          <button type="button" id="tb-avg" aria-pressed="true">Average</button>
          <button type="button" id="tb-fifo" aria-pressed="false">FIFO</button>
        </div>
        <button type="button" id="tb-add" class="primary">+ Trade</button>
        <button type="button" id="tb-account">+ Account</button>
        <button type="button" id="tb-settings" class="icon-btn" aria-haspopup="dialog" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
      </div>
    </div>
  </header>

  <div id="banner" role="status" aria-live="polite" hidden></div>

  <main>
    <div id="view-home">
      <section id="hero" aria-label="Portfolio total">
        <p class="hero-label">Total balance</p>
        <p class="hero-value" id="hero-value">—</p>
        <p class="hero-pl" id="hero-pl" aria-live="polite"></p>
        <p id="tb-totals" class="hero-sub" aria-live="polite"></p>
      </section>
      <section id="overview" aria-label="Summary">
        <div class="cards" id="summary-cards"></div>
      </section>
      <section id="accounts" aria-label="Accounts">
      </section>
    </div>
    <div id="view-account" hidden>
      <a href="#/" id="acct-back">‹ Accounts</a>
      <section id="account-detail" aria-label="Account detail"></section>
    </div>
  </main>

  <dialog id="trade-dialog" aria-labelledby="trade-dialog-title">
    <div class="dialog-head">
      <h2 id="trade-dialog-title">Add trade</h2>
      <button type="button" data-close aria-label="Close dialog">✕</button>
    </div>
    <div id="trade-dialog-body"></div>
  </dialog>

  <dialog id="account-dialog" aria-labelledby="account-dialog-title">
    <div class="dialog-head">
      <h2 id="account-dialog-title">New account</h2>
      <button type="button" data-close aria-label="Close dialog">✕</button>
    </div>
    <div id="account-dialog-body"></div>
  </dialog>

  <dialog id="settings-dialog" aria-labelledby="settings-dialog-title">
    <div class="dialog-head">
      <h2 id="settings-dialog-title">Settings</h2>
      <button type="button" data-close aria-label="Close dialog">✕</button>
    </div>
    <div id="settings-dialog-body"></div>
  </dialog>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <div class="dialog-head">
      <h2 id="confirm-title">Are you sure?</h2>
    </div>
    <p id="confirm-message" class="muted"></p>
    <div class="dialog-actions">
      <button type="button" id="confirm-cancel">Cancel</button>
      <button type="button" id="confirm-ok" class="primary danger-btn">Confirm</button>
    </div>
  </dialog>

  <noscript>
    <p>INOCULENS ASSETS needs JavaScript to compute your local-first portfolio. No data leaves your browser.</p>
  </noscript>

  <footer><p id="app-ver" class="muted"></p></footer>

  <script src="/app.js" defer></script>
</body>
</html>
