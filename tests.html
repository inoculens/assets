<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INOCULENS ASSETS — Tests</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./styles.css">
  <style>
    body { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    #summary { font-weight: 600; margin: 1rem 0; }
    #results { list-style: none; padding: 0; }
    #results li { padding: 0.4rem 0.6rem; margin: 0.25rem 0; border-radius: 0.4rem; }
    #results li.pass { background: rgba(0, 200, 0, 0.12); }
    #results li.fail { background: rgba(255, 0, 51, 0.14); }
    #results .err { display: block; font-size: 0.85em; opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <h1>INOCULENS ASSETS — Test Harness</h1>
    <p>Browser-native tests for pure functions exposed on <code>window.Inoculens</code>. Later tasks append sections below the Store section.</p>
  </header>

  <main>
    <div id="summary" role="status" aria-live="polite">running…</div>
    <ul id="results"></ul>
  </main>

  <noscript>
    <p>Tests need JavaScript.</p>
  </noscript>

  <script src="./app.js"></script>
  <script>
    'use strict';
    // Minimal harness: test(name, fn), assert(cond, msg). Results render into #results.
    var results = [];
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'assertion failed');
    }
    function test(name, fn) {
      var r;
      try {
        r = fn();
      } catch (e) {
        results.push({ name: name, ok: false, error: String((e && e.message) || e) });
        return;
      }
      // Async support (Fx task): a promise-returning fn settles later and re-renders.
      if (r && typeof r.then === 'function') {
        r.then(function () {
          results.push({ name: name, ok: true });
          renderResults();
        }, function (e) {
          results.push({ name: name, ok: false, error: String((e && e.message) || e) });
          renderResults();
        });
      } else {
        results.push({ name: name, ok: true });
      }
    }
    function renderResults() {
      var passed = results.filter(function (r) { return r.ok; }).length;
      var failed = results.length - passed;
      var summary = document.getElementById('summary');
      summary.textContent = passed + ' passed, ' + failed + ' failed (' + results.length + ' tests)';
      summary.dataset.status = failed === 0 ? 'PASS' : 'FAIL';
      var ul = document.getElementById('results');
      ul.innerHTML = '';
      results.forEach(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'fail';
        li.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name;
        if (!r.ok) {
          var s = document.createElement('span');
          s.className = 'err';
          s.textContent = r.error;
          li.appendChild(s);
        }
        ul.appendChild(li);
      });
    }

    // === Store tests ===
    (function storeTests() {
      var Store = window.Inoculens || {};
      var loadState = Store.loadState;
      var saveState = Store.saveState;
      var exportState = Store.exportState;
      var importState = Store.importState;

      // Preserve any real user data across the test run; restore afterwards.
      var backup = null;
      try { backup = localStorage.getItem('inoculens.v1'); } catch (e) { backup = null; }
      function restore() {
        try {
          if (backup === null) localStorage.removeItem('inoculens.v1');
          else localStorage.setItem('inoculens.v1', backup);
        } catch (e) { /* ignore */ }
      }

      try {
        test('store round-trip', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: {} };
          saveState(s);
          assert(JSON.stringify(loadState()) === JSON.stringify(s), 'loadState did not return saved state');
        });

        test('export shape', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: {} };
          var out = JSON.parse(exportState(s));
          assert(out.app === 'inoculens-assets' && out.version === 1 && Array.isArray(out.trades), 'bad envelope: ' + JSON.stringify(out));
          assert(out.settings && out.settings.mainCurrency === 'EUR', 'envelope missing settings');
          assert(typeof out.exportedAt === 'string', 'envelope missing exportedAt');
          assert(out.priceOverrides && typeof out.priceOverrides === 'object', 'envelope missing priceOverrides');
        });

        test('corrupt import rejects, state untouched', function () {
          var before = loadState();
          try { importState('not-json'); assert(false, 'should have thrown on non-JSON'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
          try { importState(JSON.stringify({ app: 'x', version: 99 })); assert(false, 'should have thrown on bad envelope'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });

        test('loadState falls back to defaults', function () {
          try { localStorage.removeItem('inoculens.v1'); } catch (e) { /* ignore */ }
          var d = loadState();
          assert(d.settings.mainCurrency === 'EUR' && d.settings.costMethod === 'average', 'bad default settings');
          assert(Array.isArray(d.trades) && d.trades.length === 0, 'default trades not empty');
          try { localStorage.setItem('inoculens.v1', '###corrupt###'); } catch (e) { /* ignore */ }
          var d2 = loadState();
          assert(d2.settings.mainCurrency === 'EUR' && Array.isArray(d2.trades), 'corrupt storage did not fall back');
        });

        test('export/import round-trip identity', function () {
          var s = { settings: { mainCurrency: 'USD', costMethod: 'fifo' }, trades: [], priceOverrides: {} };
          var json = exportState(s);
          try { localStorage.removeItem('inoculens.v1'); } catch (e) { /* ignore */ }
          var back = importState(json);
          assert(back.settings.mainCurrency === 'USD' && back.settings.costMethod === 'fifo', 'imported settings mismatch');
          assert(Array.isArray(back.trades) && back.trades.length === 0, 'imported trades mismatch');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('priceOverrides round-trip', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: { BTC: 50000, ETH: 3000.5 } };
          var json = exportState(s);
          assert(JSON.stringify(JSON.parse(json).priceOverrides) === JSON.stringify(s.priceOverrides), 'envelope dropped priceOverrides');
          try { localStorage.removeItem('inoculens.v1'); } catch (e) { /* ignore */ }
          var back = importState(json);
          assert(JSON.stringify(back.priceOverrides) === JSON.stringify(s.priceOverrides), 'imported priceOverrides mismatch');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('legacy envelope without priceOverrides imports with {}', function () {
          var legacy = JSON.stringify({ app: 'inoculens-assets', version: 1, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'fifo' }, trades: [] });
          try { localStorage.removeItem('inoculens.v1'); } catch (e) { /* ignore */ }
          var back = importState(legacy);
          assert(JSON.stringify(back.priceOverrides) === '{}', 'legacy import did not default priceOverrides to {}');
          assert(back.settings.costMethod === 'fifo', 'legacy import lost settings');
        });

        test('invalid priceOverrides rejects, state untouched', function () {
          var before = loadState();
          var bad = JSON.stringify({ app: 'inoculens-assets', version: 1, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: { BTC: 'high' } });
          try { importState(bad); assert(false, 'should have thrown on non-numeric override'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });
      } finally {
        restore();
      }
    })();

    // === Fx tests ===
    (function fxTests() {
      var Fx = window.Inoculens || {};
      var normalizeToMain = Fx.normalizeToMain;
      var stableToUsd = Fx.stableToUsd;
      var pickRate = Fx.pickRate;
      var fetchEcbRate = Fx.fetchEcbRate;

      test('normalizeToMain scales total+fee', function () {
        assert(normalizeToMain(10, 0, 0.92) === 9.2, 'expected 9.2, got ' + normalizeToMain(10, 0, 0.92));
        assert(normalizeToMain(10, 2, 0.5) === 6, 'fee not converted at same rate');
      });

      test('stablecoin path flag', function () {
        assert(stableToUsd('USDC') === true && stableToUsd('EUR') === false, 'stable flag wrong');
        assert(stableToUsd('USDT') === true && stableToUsd('DAI') === true, 'USDT/DAI should map to USD');
        assert(stableToUsd('USD') === false, 'USD itself is not a stable mapping');
      });

      test('pickRate forward-fill uses previous fixing', function () {
        var r = pickRate({ '2026-09-30': 0.9 }, '2026-10-01');
        assert(r.rate === 0.9 && r.interpolated === true, 'weekend-gap forward-fill failed: ' + JSON.stringify(r));
        assert(r.source === 'ECB-2026-09-30', 'source should pin actual fixing date: ' + JSON.stringify(r));
      });

      test('pickRate exact date is not interpolated', function () {
        var r = pickRate({ '2026-10-01': 0.92 }, '2026-10-01');
        assert(r.rate === 0.92 && r.interpolated === false, 'exact fixing flagged interpolated');
        assert(r.source === 'ECB-2026-10-01', 'bad source: ' + JSON.stringify(r));
      });

      test('pickRate gives up after 5-day window', function () {
        var r = pickRate({ '2026-09-20': 0.9 }, '2026-10-01');
        assert(r === null, 'expected null beyond lookback, got ' + JSON.stringify(r));
      });

      test('fetchEcbRate same-currency needs no network', function () {
        var origFetch = window.fetch;
        var called = 0;
        window.fetch = function () { called++; return Promise.reject(new Error('must not fetch')); };
        function restore() { window.fetch = origFetch; }
        return fetchEcbRate('2026-10-01', 'EUR', 'EUR').then(function (r) {
          restore();
          assert(r.rate === 1 && r.interpolated === false && r.source === '1:1', 'bad 1:1 result: ' + JSON.stringify(r));
          assert(called === 0, 'same-currency must not hit network');
        }, function (e) { restore(); throw e; });
      });

      test('fetchEcbRate exact date', function () {
        var origFetch = window.fetch;
        window.fetch = function () {
          return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ rates: { EUR: 0.92 } }); } });
        };
        function restore() { window.fetch = origFetch; }
        return fetchEcbRate('2026-10-01', 'USD', 'EUR').then(function (r) {
          restore();
          assert(r.rate === 0.92 && r.interpolated === false && r.source === 'ECB-2026-10-01', 'bad exact result: ' + JSON.stringify(r));
        }, function (e) { restore(); throw e; });
      });

      test('fetchEcbRate weekend-gap walks back (empty + 404)', function () {
        var origFetch = window.fetch;
        window.fetch = function (url) {
          if (url.indexOf('2026-10-01') !== -1) {
            return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ rates: {} }); } });
          }
          if (url.indexOf('2026-09-30') !== -1) {
            return Promise.resolve({ ok: false, status: 404 });
          }
          return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ rates: { EUR: 0.9 } }); } });
        };
        function restore() { window.fetch = origFetch; }
        return fetchEcbRate('2026-10-01', 'USD', 'EUR').then(function (r) {
          restore();
          assert(r.rate === 0.9 && r.interpolated === true && r.source === 'ECB-2026-09-29', 'no forward-fill: ' + JSON.stringify(r));
        }, function (e) { restore(); throw e; });
      });

      test('fetchEcbRate stablecoin maps via USD', function () {
        var origFetch = window.fetch;
        var urls = [];
        window.fetch = function (url) {
          urls.push(url);
          return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ rates: { EUR: 0.92 } }); } });
        };
        function restore() { window.fetch = origFetch; }
        return fetchEcbRate('2026-10-01', 'USDC', 'EUR').then(function (r) {
          restore();
          assert(urls.length === 1 && urls[0].indexOf('from=USD') !== -1 && urls[0].indexOf('to=EUR') !== -1, 'stable not mapped USDC->USD: ' + urls.join(','));
          assert(r.rate === 0.92, 'bad stable rate: ' + JSON.stringify(r));
        }, function (e) { restore(); throw e; });
      });

      test('fetchEcbRate failure throws fx-unavailable after retry', function () {
        var origFetch = window.fetch;
        var called = 0;
        window.fetch = function () { called++; return Promise.reject(new Error('net down')); };
        function restore() { window.fetch = origFetch; }
        return fetchEcbRate('2026-10-01', 'USD', 'EUR').then(function () {
          restore();
          assert(false, 'should have thrown fx-unavailable');
        }, function (e) {
          restore();
          assert(e && e.message === 'fx-unavailable', 'wrong error: ' + ((e && e.message) || e));
          assert(called === 2, 'expected exactly one retry, got ' + called);
        });
      });
    })();

    // === Ledger tests (Task 4: normalize + average + FIFO) ===
    (function ledgerTests() {
      var L = window.Inoculens || {};
      var normalizeTrade = L.normalizeTrade;
      var computeAverage = L.computeAverage;
      var computeFifo = L.computeFifo;
      var computePositions = L.computePositions;
      var validateTrade = L.validateTrade;

      // Spec fixture — verbatim values from task brief.
      function specTrades() {
        return [
          {id:'a',type:'buy',symbol:'BTC',qty:1,total:50000,currency:'EUR',date:'2026-01-01',fee:0,feeCurrency:'EUR',fxLock:{pair:'EUR/EUR',rate:1,source:'1:1'}},
          {id:'b',type:'buy',symbol:'BTC',qty:1,total:70000,currency:'EUR',date:'2026-02-01',fee:0,feeCurrency:'EUR',fxLock:{pair:'EUR/EUR',rate:1,source:'1:1'}},
          {id:'c',type:'sell',symbol:'BTC',qty:1,total:80000,currency:'EUR',date:'2026-03-01',fee:0,feeCurrency:'EUR',fxLock:{pair:'EUR/EUR',rate:1,source:'1:1'}},
        ];
      }

      test('ledger fns exposed', function () {
        assert(typeof normalizeTrade === 'function', 'normalizeTrade missing');
        assert(typeof computeAverage === 'function', 'computeAverage missing');
        assert(typeof computeFifo === 'function', 'computeFifo missing');
        assert(typeof computePositions === 'function', 'computePositions missing');
        assert(typeof validateTrade === 'function', 'validateTrade missing');
      });

      test('normalizeTrade converts at fxLock rate', function () {
        var r = normalizeTrade({ total: 10, fee: 2, currency: 'USD', feeCurrency: 'USD', fxLock: { pair: 'USD/EUR', rate: 0.5, source: 'ECB-2026-10-01' } });
        assert(r.totalMain === 5, 'totalMain expected 5, got ' + r.totalMain);
        assert(r.feeMain === 1, 'feeMain expected 1, got ' + r.feeMain);
      });

      test('normalizeTrade feeCurrency mismatch assumes same rate + flags', function () {
        var r = normalizeTrade({ total: 100, fee: 10, currency: 'USD', feeCurrency: 'EUR', fxLock: { pair: 'USD/EUR', rate: 0.5, source: 'ECB-2026-10-01' } });
        assert(r.feeMain === 5, 'fee should fall back to trade lock rate, got ' + r.feeMain);
        assert(r.feeFxAssumedSameRate === true, 'missing feeFxAssumedSameRate flag');
        var r2 = normalizeTrade({ total: 100, fee: 10, currency: 'USD', feeCurrency: 'EUR', fxLock: { pair: 'USD/EUR', rate: 0.5, source: 'ECB-2026-10-01' }, feeFxLock: { pair: 'EUR/EUR', rate: 1, source: '1:1' } });
        assert(r2.feeMain === 10, 'feeFxLock rate not used, got ' + r2.feeMain);
        assert(!r2.feeFxAssumedSameRate, 'flag must be absent when feeFxLock present');
      });

      test('average-cost spec fixture (avg 60k / realized 20k / qty 1)', function () {
        var tr = specTrades();
        var avg = computeAverage(tr).get('BTC');
        assert(avg.avgEntry === 60000 && avg.realized === 20000 && avg.qty === 1,
          'bad average: ' + JSON.stringify(avg));
      });

      test('FIFO spec fixture (realized 30k, first-lot gain 30k)', function () {
        var tr = specTrades();
        var fifo = computeFifo(tr).get('BTC');
        assert(fifo.realized === 30000 && fifo.lots[0].gain === 30000,
          'bad fifo: ' + JSON.stringify(fifo));
      });

      test('FIFO lots carry holdingDays + open/close dates', function () {
        var fifo = computeFifo(specTrades()).get('BTC');
        var lot = fifo.lots[0];
        assert(lot.openDate === '2026-01-01' && lot.closeDate === '2026-03-01',
          'bad lot dates: ' + JSON.stringify(lot));
        assert(typeof lot.holdingDays === 'number' && lot.holdingDays > 0,
          'bad holdingDays: ' + JSON.stringify(lot));
        assert(lot.qty === 1 && lot.proceeds === 80000 && lot.cost === 50000,
          'bad lot amounts: ' + JSON.stringify(lot));
      });

      test('validateTrade oversell blocked, exact sell allowed', function () {
        assert(validateTrade({type:'sell',symbol:'BTC',qty:5}, 1) !== null, 'oversell not blocked');
        assert(validateTrade({type:'sell',symbol:'BTC',qty:1}, 1) === null, 'exact sell should pass');
      });

      test('validateTrade blocks qty<=0, total<0, future date', function () {
        assert(validateTrade({ type: 'buy', symbol: 'BTC', qty: 0 }, 0) !== null, 'qty 0 not blocked');
        assert(validateTrade({ type: 'buy', symbol: 'BTC', qty: -1 }, 0) !== null, 'negative qty not blocked');
        assert(validateTrade({ type: 'buy', symbol: 'BTC', qty: 1, total: -5 }, 0) !== null, 'negative total not blocked');
        assert(validateTrade({ type: 'buy', symbol: 'BTC', qty: 1, total: 10, date: '2999-01-01' }, 0) !== null, 'future date not blocked');
        assert(validateTrade({ type: 'buy', symbol: 'BTC', qty: 1, total: 10, date: '2026-01-01' }, 0) === null, 'valid buy rejected');
      });

      test('compute never goes negative on oversell', function () {
        var tr = specTrades().concat([
          {id:'d',type:'sell',symbol:'BTC',qty:99,total:99*80000,currency:'EUR',date:'2026-04-01',fee:0,feeCurrency:'EUR',fxLock:{pair:'EUR/EUR',rate:1,source:'1:1'}},
        ]);
        var avg = computeAverage(tr).get('BTC');
        var fifo = computeFifo(tr).get('BTC');
        assert(avg.qty === 0 && avg.qty >= 0, 'average went negative: ' + JSON.stringify(avg));
        assert(fifo.qty === 0 && fifo.qty >= 0, 'fifo went negative: ' + JSON.stringify(fifo));
      });

      test('computePositions shape for Ui (Task 6)', function () {
        var rows = computePositions(specTrades(), { BTC: 100000 }, 'average');
        assert(rows.length === 1, 'expected 1 row, got ' + rows.length);
        var p = rows[0];
        assert(p.symbol === 'BTC' && p.qtyHeld === 1 && p.avgEntry === 60000, 'bad position head: ' + JSON.stringify(p));
        assert(p.livePrice === 100000 && p.marketValue === 100000, 'bad market value: ' + JSON.stringify(p));
        assert(p.unrealized === 40000 && p.realized === 20000 && p.totalPL === 60000, 'bad P&L: ' + JSON.stringify(p));
        assert(typeof p.returnPct === 'number' && isFinite(p.returnPct), 'bad returnPct: ' + JSON.stringify(p));
        var fr = computePositions(specTrades(), { BTC: 100000 }, 'fifo')[0];
        assert(fr.realized === 30000, 'fifo method not honoured: ' + JSON.stringify(fr));
      });
    })();

    // === Prices tests (Task 5: mapping/cache only, no network asserts) ===
    (function pricesTests() {
      var P = window.Inoculens || {};
      var SYMBOL_MAP = P.SYMBOL_MAP;
      var fetchLivePrice = P.fetchLivePrice;
      var refreshAllPrices = P.refreshAllPrices;

      var backup = null;
      try { backup = localStorage.getItem('inoculens.v1'); } catch (e) { backup = null; }
      function setState(s) { try { localStorage.setItem('inoculens.v1', JSON.stringify(s)); } catch (e) { /* ignore */ } }
      function restoreState() {
        try {
          if (backup === null) localStorage.removeItem('inoculens.v1');
          else localStorage.setItem('inoculens.v1', backup);
        } catch (e) { /* ignore */ }
      }
      function clearPriceCache() {
        var c = (window.Inoculens || {}).priceCache;
        if (c && typeof c === 'object') {
          Object.keys(c).forEach(function (k) { delete c[k]; });
        }
      }

      test('SYMBOL_MAP maps BTC/ETH/SOL', function () {
        assert(SYMBOL_MAP['BTC'] === 'bitcoin', 'BTC should map to bitcoin');
        assert(SYMBOL_MAP['ETH'] === 'ethereum', 'ETH should map to ethereum');
        assert(SYMBOL_MAP['SOL'] === 'solana', 'SOL should map to solana');
      });

      test('override short-circuits network', function () {
        var origFetch = window.fetch;
        var called = 0;
        window.fetch = function () { called++; return Promise.reject(new Error('must not fetch')); };
        setState({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: { BTC: 67000 } });
        function restore() { window.fetch = origFetch; restoreState(); }
        return fetchLivePrice('BTC', 'EUR').then(function (p) {
          restore();
          assert(p === 67000, 'override should win, got ' + p);
          assert(called === 0, 'override must not hit network');
        }, function (e) { restore(); throw e; });
      });

      test('unknown symbol returns null, never throws, no network', function () {
        var origFetch = window.fetch;
        var called = 0;
        window.fetch = function () { called++; return Promise.reject(new Error('must not fetch')); };
        setState({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: {} });
        function restore() { window.fetch = origFetch; restoreState(); }
        return fetchLivePrice('XYZ123', 'EUR').then(function (p) {
          restore();
          assert(p === null, 'unknown symbol should be null, got ' + p);
          assert(called === 0, 'unknown symbol must not hit network');
        }, function (e) { restore(); throw e; });
      });

      test('60s cache survives network failure', function () {
        var origFetch = window.fetch;
        setState({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: {} });
        clearPriceCache();
        window.fetch = function () {
          return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ ethereum: { usd: 2222 } }); } });
        };
        function restore() { window.fetch = origFetch; restoreState(); }
        // ETH/USD key: no other test touches it, so interleaved async
        // continuations cannot clobber this cache entry.
        return fetchLivePrice('ETH', 'USD').then(function (first) {
          assert(first === 2222, 'live fetch should return 2222, got ' + first);
          // Re-establish isolation before re-reading: the harness runs all
          // test fns synchronously, so later tests overwrite localStorage
          // and window.fetch before this continuation runs.
          setState({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: {} });
          window.fetch = function () { return Promise.reject(new Error('net down')); };
          return fetchLivePrice('ETH', 'USD');
        }).then(function (second) {
          restore();
          assert(second === 2222, 'cached price should survive failure, got ' + second);
        }, function (e) { restore(); throw e; });
      });

      test('default vs comes from settings.mainCurrency', function () {
        var origFetch = window.fetch;
        var urls = [];
        setState({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: {} });
        clearPriceCache();
        window.fetch = function (url) {
          urls.push(String(url));
          return Promise.resolve({ ok: true, json: function () { return Promise.resolve({ bitcoin: { eur: 50000 } }); } });
        };
        function restore() { window.fetch = origFetch; restoreState(); }
        return fetchLivePrice('BTC').then(function (p) {
          restore();
          assert(p === 50000, 'expected 50000, got ' + p);
          assert(urls.length === 1 && urls[0].indexOf('vs_currencies=eur') !== -1, 'default vs should be mainCurrency: ' + urls.join(','));
        }, function (e) { restore(); throw e; });
      });

      test('refreshAllPrices dedupes + uppercases', function () {
        setState({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [], priceOverrides: { BTC: 67000, ETH: 3500 } });
        function restore() { restoreState(); }
        return refreshAllPrices(['btc', 'BTC', 'eth'], 'EUR').then(function (out) {
          restore();
          var keys = Object.keys(out).sort();
          assert(keys.length === 2 && keys[0] === 'BTC' && keys[1] === 'ETH', 'should dedupe + uppercase, got ' + JSON.stringify(out));
          assert(out.BTC === 67000 && out.ETH === 3500, 'bad values: ' + JSON.stringify(out));
        }, function (e) { restore(); throw e; });
      });
    })();

    // Later tasks (Ui) append new section IIFEs here.

    renderResults();
  </script>
