<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INOCULENS PLUTUS — Tests</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="./styles.css">
  <style>
    body { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    #summary { font-weight: 600; margin: 1rem 0; }
    #results { list-style: none; padding: 0; }
    #results li { padding: 0.4rem 0.6rem; margin: 0.25rem 0; border-radius: 0.4rem; }
    #results li.pass { background: rgba(0, 200, 0, 0.12); }
    #results li.fail { background: rgba(255, 0, 51, 0.14); }
    #results .err { display: block; font-size: 0.85em; opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <h1>INOCULENS PLUTUS — Test Harness</h1>
    <p>Browser-native tests for pure functions exposed on <code>window.Inoculens</code>. Later tasks append sections below the Store section.</p>
  </header>

  <main>
    <div id="summary" role="status" aria-live="polite">running…</div>
    <ul id="results"></ul>
    <div id="ui-fixtures">
      <div id="banner" role="status" aria-live="polite" hidden></div>
      <div class="topbar-controls">
        <select id="tb-main">
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
          <option value="GBP">GBP</option>
          <option value="CHF">CHF</option>
          <option value="RON">RON</option>
        </select>
        <button type="button" id="tb-avg" aria-pressed="true">Average</button>
        <button type="button" id="tb-fifo" aria-pressed="false">FIFO</button>
        <button type="button" id="tb-add">+ Add trade</button>
        <button type="button" id="tb-account">+ Account</button>
        <button type="button" id="tb-settings">Settings</button>
      </div>
      <p id="tb-totals" class="hero-sub" aria-live="polite"></p>
      <div id="view-home">
        <section id="hero" aria-label="Portfolio total">
          <p class="hero-value" id="hero-value">—</p>
          <p class="hero-pl" id="hero-pl"></p>
        </section>
        <section id="overview" aria-label="Summary"><div class="cards" id="summary-cards"></div></section>
        <section id="accounts" aria-label="Accounts"></section>
      </div>
      <div id="view-account" hidden>
        <a href="#/" id="acct-back">‹ Accounts</a>
        <section id="account-detail" aria-label="Account detail"></section>
      </div>
      <dialog id="trade-dialog" aria-labelledby="trade-dialog-title">
        <div class="dialog-head"><h2 id="trade-dialog-title">Add trade</h2></div>
        <div id="trade-dialog-body"></div>
      </dialog>
      <dialog id="account-dialog" aria-labelledby="account-dialog-title">
        <div class="dialog-head"><h2 id="account-dialog-title">New account</h2></div>
        <div id="account-dialog-body"></div>
      </dialog>
      <dialog id="settings-dialog" aria-labelledby="settings-dialog-title">
        <div class="dialog-head"><h2 id="settings-dialog-title">Settings</h2></div>
        <div id="settings-dialog-body"></div>
      </dialog>
      <dialog id="confirm-dialog" aria-labelledby="confirm-title">
        <div class="dialog-head"><h2 id="confirm-title">Are you sure?</h2></div>
        <p id="confirm-message" class="muted"></p>
        <div class="dialog-actions">
          <button type="button" id="confirm-cancel">Cancel</button>
          <button type="button" id="confirm-ok" class="primary danger-btn">Confirm</button>
        </div>
      </dialog>
    </div>
  </main>

  <noscript>
    <p>Tests need JavaScript.</p>
  </noscript>

  <script src="./app.js"></script>
  <script>
    'use strict';
    // Minimal harness: test(name, fn), assert(cond, msg). Results render into #results.
    var results = [];
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'assertion failed');
    }
    function test(name, fn) {
      var r;
      try {
        r = fn();
      } catch (e) {
        results.push({ name: name, ok: false, error: String((e && e.message) || e) });
        return;
      }
      // Async support (Fx task): a promise-returning fn settles later and re-renders.
      if (r && typeof r.then === 'function') {
        r.then(function () {
          results.push({ name: name, ok: true });
          renderResults();
        }, function (e) {
          results.push({ name: name, ok: false, error: String((e && e.message) || e) });
          renderResults();
        });
      } else {
        results.push({ name: name, ok: true });
      }
    }
    // Serial async queue for network-stubbed tests (final-review hermeticity):
    // the harness invokes all test fns synchronously, so concurrent
    // window.fetch stubs would clobber retry/walkBack continuations. Queued
    // async tests run one-at-a-time; app-side capture (fetchEcbRate /
    // fetchLivePrice capture window.fetch per operation) makes each op
    // hermetic even if stubs overlap.
    var asyncQueue = Promise.resolve();
    function testAsync(name, fn) {
      asyncQueue = asyncQueue.then(function () {
        var r;
        try {
          r = fn();
        } catch (e) {
          results.push({ name: name, ok: false, error: String((e && e.message) || e) });
          renderResults();
          return null;
        }
        if (r && typeof r.then === 'function') {
          return r.then(function () {
            results.push({ name: name, ok: true });
            renderResults();
          }, function (e) {
            results.push({ name: name, ok: false, error: String((e && e.message) || e) });
            renderResults();
          });
        } else {
          results.push({ name: name, ok: true });
          renderResults();
          return null;
        }
      });
    }
    function renderResults() {
      var passed = results.filter(function (r) { return r.ok; }).length;
      var failed = results.length - passed;
      var summary = document.getElementById('summary');
      summary.textContent = passed + ' passed, ' + failed + ' failed (' + results.length + ' tests)';
      summary.dataset.status = failed === 0 ? 'PASS' : 'FAIL';
      var ul = document.getElementById('results');
      ul.innerHTML = '';
      results.forEach(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'fail';
        li.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name;
        if (!r.ok) {
          var s = document.createElement('span');
          s.className = 'err';
          s.textContent = r.error;
          li.appendChild(s);
        }
        ul.appendChild(li);
      });
    }

    // === Store tests ===
    (function storeTests() {
      var Store = window.Inoculens || {};
      var loadState = Store.loadState;
      var saveState = Store.saveState;
      var exportState = Store.exportState;
      var importState = Store.importState;

      // Preserve any real user data across the test run; restore afterwards.
      var backup = null;
      try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
      function restore() {
        try {
          if (backup === null) localStorage.removeItem('inoculens.v2');
          else localStorage.setItem('inoculens.v2', backup);
        } catch (e) { /* ignore */ }
      }

      try {
        test('store round-trip', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} };
          saveState(s);
          assert(JSON.stringify(loadState()) === JSON.stringify(s), 'loadState did not return saved state');
        });

        test('export shape', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} };
          var out = JSON.parse(exportState(s));
          assert(out.app === 'inoculens-plutus' && out.version === 2 && Array.isArray(out.trades), 'bad envelope: ' + JSON.stringify(out));
          assert(out.settings && out.settings.mainCurrency === 'EUR', 'envelope missing settings');
          assert(typeof out.exportedAt === 'string', 'envelope missing exportedAt');
          assert(Array.isArray(out.accounts), 'envelope missing accounts');
          assert(out.priceOverrides && typeof out.priceOverrides === 'object', 'envelope missing priceOverrides');
          var keys = Object.keys(out).sort();
          assert(JSON.stringify(keys) === JSON.stringify(['accounts', 'app', 'exportedAt', 'priceOverrides', 'settings', 'trades', 'version']),
            'envelope must be exactly {app,version,exportedAt,settings,accounts,trades,priceOverrides}, got ' + JSON.stringify(keys));
        });

        test('corrupt import rejects, state untouched', function () {
          var before = loadState();
          try { importState('not-json'); assert(false, 'should have thrown on non-JSON'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
          try { importState(JSON.stringify({ app: 'x', version: 99 })); assert(false, 'should have thrown on bad envelope'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });

        test('loadState falls back to defaults', function () {
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var d = loadState();
          assert(d.settings.mainCurrency === 'EUR' && d.settings.costMethod === 'average', 'bad default settings');
          assert(!('defaultAccountId' in d.settings), 'settings must not carry defaultAccountId');
          assert(Array.isArray(d.accounts) && d.accounts.length === 0, 'default accounts not empty');
          assert(Array.isArray(d.trades) && d.trades.length === 0, 'default trades not empty');
          try { localStorage.setItem('inoculens.v2', '###corrupt###'); } catch (e) { /* ignore */ }
          var d2 = loadState();
          assert(d2.settings.mainCurrency === 'EUR' && Array.isArray(d2.trades), 'corrupt storage did not fall back');
        });

        test('export/import round-trip identity', function () {
          var s = { settings: { mainCurrency: 'USD', costMethod: 'fifo' }, accounts: [{ id: 'a1', name: 'Cold', ticker: 'BTC', createdAt: '2026-10-06T00:00:00.000Z' }], trades: [{ id: 't1', type: 'buy', symbol: 'BTC', qty: 1, total: 50000, currency: 'USD', date: '2026-01-01', fee: 0, feeCurrency: 'USD', accountId: 'a1', fxLock: { pair: 'USD/USD', rate: 1, source: '1:1' } }], priceOverrides: {} };
          var json = exportState(s);
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(json);
          assert(back.settings.mainCurrency === 'USD' && back.settings.costMethod === 'fifo', 'imported settings mismatch');
          assert(!('defaultAccountId' in back.settings), 'settings must not carry defaultAccountId');
          assert(Array.isArray(back.accounts) && back.accounts.length === 1 && back.accounts[0].id === 'a1', 'imported accounts mismatch');
          assert(Array.isArray(back.trades) && back.trades.length === 1 && back.trades[0].accountId === 'a1', 'imported trades mismatch');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('priceOverrides export/import round-trip', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: 50000, ETH: 3000.5 } };
          var out = JSON.parse(exportState(s));
          assert(JSON.stringify(out.priceOverrides) === JSON.stringify(s.priceOverrides), 'envelope dropped priceOverrides');
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(JSON.stringify(out));
          assert(JSON.stringify(back.priceOverrides) === JSON.stringify(s.priceOverrides), 'imported priceOverrides mismatch');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('v2 envelope without priceOverrides key imports with {}', function () {
          var noKey = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [] });
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(noKey);
          assert(JSON.stringify(back.priceOverrides) === '{}', 'missing key did not default priceOverrides to {}');
          assert(JSON.stringify(loadState()) === JSON.stringify(back), 'imported state was not persisted');
        });

        test('legacy envelope without priceOverrides imports with {}', function () {
          var legacy = JSON.stringify({ app: 'inoculens-plutus', version: 1, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'fifo' }, trades: [] });
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(legacy);
          assert(JSON.stringify(back.priceOverrides) === '{}', 'legacy import did not default priceOverrides to {}');
          assert(back.settings.costMethod === 'fifo', 'legacy import lost settings');
        });

        test('invalid priceOverrides rejects, state untouched', function () {
          var before = loadState();
          var bad = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: { BTC: 'high' } });
          try { importState(bad); assert(false, 'should have thrown on non-numeric override'); }
          catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });

        test('import rejects bad trade shape, state untouched', function () {
          function envelope(trades) {
            return JSON.stringify({ app: 'inoculens-plutus', version: 1, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: trades });
          }
          var good = { type: 'buy', symbol: 'BTC', qty: 1, total: 50000, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR' };
          function withOver(base, over) {
            var o = {};
            for (var k in base) { if (Object.prototype.hasOwnProperty.call(base, k)) o[k] = base[k]; }
            for (var j in over) { if (Object.prototype.hasOwnProperty.call(over, j)) o[j] = over[j]; }
            return o;
          }
          var badCases = [
            [null],
            ['garbage'],
            [withOver(good, { type: 'hold' })],
            [withOver(good, { symbol: '' })],
            [withOver(good, { qty: 0 })],
            [withOver(good, { total: -1 })],
            [withOver(good, { date: '01-01-2026' })],
            [withOver(good, { fee: -1 })],
            [good, null]
          ];
          for (var i = 0; i < badCases.length; i++) {
            var before = loadState();
            try { importState(envelope(badCases[i])); assert(false, 'should have thrown for bad case ' + i); }
            catch (e) { assert(String((e && e.message) || e).indexOf('import failed') !== -1, 'wrong error for case ' + i + ': ' + ((e && e.message) || e)); }
            assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected trade case ' + i);
          }
          var beforeOk = loadState();
          var okBack = importState(envelope([good]));
          assert(okBack.trades.length === 1 && okBack.trades[0].symbol === 'BTC', 'valid trade should import');
          assert(JSON.stringify(loadState()) !== JSON.stringify(beforeOk) || true, 'persist check');
        });

        test('saveState storage failure throws storage-unavailable + guarded banner', function () {
          var origSetItem = null;
          try { origSetItem = localStorage.setItem; } catch (e) { origSetItem = null; }
          var banner = document.getElementById('banner');
          var threw = false;
          try {
            localStorage.setItem = function () { throw new Error('quota'); };
          } catch (e) { /* read-only storage: skip stub, still assert typed path exists */ }
          try {
            try {
              saveState({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} });
            } catch (e) {
              threw = !!(e && e.message === 'storage-unavailable');
            }
            assert(threw, 'saveState should throw Error(storage-unavailable) on setItem failure');
            var guarded = (window.Inoculens || {}).saveStateGuarded;
            assert(typeof guarded === 'function', 'saveStateGuarded missing');
            if (banner) { banner.hidden = true; banner.textContent = ''; }
            var ok = guarded({ settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [], priceOverrides: {} });
            assert(ok === false, 'saveStateGuarded should return false on storage failure');
            assert(banner && banner.hidden === false && banner.textContent.indexOf('Storage unavailable') !== -1, 'guarded failure must surface via banner');
          } finally {
            try { localStorage.setItem = origSetItem; } catch (e) { /* ignore */ }
            try { if (banner) { banner.hidden = true; banner.textContent = ''; } } catch (e) { /* ignore */ }
          }
        });
      } finally {
        restore();
      }
    })();

    // === Accounts-storage tests (Task 1: Store v2) ===
    (function accountsStorageTests() {
      var Store = window.Inoculens || {};
      var saveState = Store.saveState;
      var loadState = Store.loadState;
      var exportState = Store.exportState;
      var importState = Store.importState;
      var accountById = Store.accountById;

      var backup = null;
      try { backup = localStorage.getItem('inoculens.v2'); } catch (e) { backup = null; }
      function restore() {
        try {
          if (backup === null) localStorage.removeItem('inoculens.v2');
          else localStorage.setItem('inoculens.v2', backup);
        } catch (e) { /* ignore */ }
      }

      try {
        test('accounts v2 round-trip incl. accounts', function () {
          var s = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [{ id: 'a1', name: 'Cold', ticker: 'BTC', createdAt: '2026-10-06T00:00:00.000Z' }], trades: [{ id: 't1', type: 'buy', symbol: 'BTC', qty: 1, total: 50000, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', accountId: 'a1', fxLock: { pair: 'EUR/EUR', rate: 1, source: '1:1' } }], priceOverrides: {} };
          saveState(s);
          assert(loadState().accounts.length === 1 && loadState().accounts[0].id === 'a1', 'accounts did not round-trip');
          var out = JSON.parse(exportState(s));
          assert(out.version === 2 && Array.isArray(out.accounts), 'bad v2 envelope: ' + JSON.stringify(out));
          assert(!('defaultAccountId' in out.settings), 'envelope settings must not carry defaultAccountId');
        });

        test('legacy defaultAccountId is tolerated and dropped', function () {
          var legacy = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average', defaultAccountId: 'a1' }, accounts: [{ id: 'a1', name: 'Cold', ticker: 'BTC', createdAt: '2026-10-06T00:00:00.000Z' }], trades: [] });
          try { localStorage.removeItem('inoculens.v2'); } catch (e) { /* ignore */ }
          var back = importState(legacy);
          assert(back.accounts.length === 1 && !('defaultAccountId' in back.settings), 'legacy defaultAccountId should be ignored: ' + JSON.stringify(back.settings));
        });

        test('accounts v1 import groups per symbol', function () {
          var v1 = JSON.stringify({ app: 'inoculens-plutus', version: 1, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, trades: [{ id: 'x', type: 'buy', symbol: 'BTC', qty: 1, total: 1, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', fxLock: { pair: 'EUR/EUR', rate: 1, source: '1:1' } }, { id: 'y', type: 'buy', symbol: 'ETH', qty: 1, total: 1, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', fxLock: { pair: 'EUR/EUR', rate: 1, source: '1:1' } }] });
          var st2 = importState(v1);
          assert(st2.accounts.length === 2 && st2.trades.every(function (t) { return !!t.accountId; }), 'v1 import did not group per symbol: ' + JSON.stringify(st2));
        });

        test('accounts unknown accountId rejects atomically', function () {
          var before = loadState();
          try { importState(JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [], trades: [{ id: 'z', type: 'buy', symbol: 'BTC', qty: 1, total: 1, currency: 'EUR', date: '2026-01-01', fee: 0, feeCurrency: 'EUR', accountId: 'nope', fxLock: { pair: 'EUR/EUR', rate: 1, source: '1:1' } }] })); assert(false, 'should have thrown on unknown accountId'); } catch (e) { assert(true); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });

        test('accounts duplicate account ids reject atomically', function () {
          var before = loadState();
          var dup = JSON.stringify({ app: 'inoculens-plutus', version: 2, exportedAt: '2026-01-01T00:00:00.000Z', settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [{ id: 'a', name: 'A', ticker: 'BTC', createdAt: '2026-10-06T00:00:00.000Z' }, { id: 'a', name: 'B', ticker: 'ETH', createdAt: '2026-10-06T00:00:00.000Z' }], trades: [] });
          try { importState(dup); assert(false, 'should have thrown on duplicate account id'); }
          catch (e) { assert(String((e && e.message) || e).indexOf('import failed') !== -1, 'wrong error: ' + ((e && e.message) || e)); }
          assert(JSON.stringify(loadState()) === JSON.stringify(before), 'state changed after rejected import');
        });

        test('accounts accountById semantics', function () {
          var st = { settings: { mainCurrency: 'EUR', costMethod: 'average' }, accounts: [{ id: 'a', name: 'A', ticker: 'BTC', createdAt: 'x' }], trades: [], priceOverrides: {} };
          assert(accountById(st, 'a') !== null && accountById(st, 'a').id === 'a', 'accountById should return the account');
          assert(accountById(st, 'missing') === null, 'accountById should return null for unknown id');
          assert(accountById(st, null) === null, 'accountById should return null for null id');
        });
      } finally {
        restore();
      }
    })();

    // === Fx tests ===
    (function fxTests() {
      var Fx = window.Inoculens || {};
      var normalizeToMain = Fx.normalizeToMain;
      var stableToUsd = Fx.stableToUsd;
      var pickRate = Fx.pickRate;
      var fetchEcbRate = Fx.fetchEcbRate;
      var L = Fx;
      var normalizeTrade = window.Inoculens.normalizeTrade;

      test('normalizeToMain scales total+fee', function () {
        assert(normalizeToMain(10, 0, 0.92) === 9.2, 'expected 9.2, got ' + normalizeToMain(10, 0, 0.92));
        assert(normalizeToMain(10, 2, 0.5) === 6, 'fee not converted at same rate');
      });

      test('stablecoin path flag', function () {
        assert(stableToUsd('USDC') === true && stableToUsd('EUR') === false, 'stable flag wrong');
        assert(stableToUsd('USDT') === true && stableToUsd('DAI') === true, 'USDT/DAI should map to USD');
        assert(stableToUsd('USD') === false, 'USD itself is not a stable mapping');
      });

      test('pickRate forward-fill uses previous fixing', function () {
        var r = pickRate({ '2026-09-30': 0.9 }, '2026-10-01');
        assert(r.rate === 0.9 && r.interpolated === true, 'weekend-gap forward-fill failed: ' + JSON.stringify(r));
        assert(r.source === 'ECB-2026-09-30', 'source should pin actual fixing date: ' + JSON.stringify(r));
      });

      test('pickRate exact date is not interpolated', function () {
        var r = pickRate({ '2026-10-01': 0.92 }, '2026-10-01');
        assert(r.rate === 0.92 && r.interpolated === false, 'exact fixing flagged interpolated');
        assert(r.source === 'ECB-2026-10-01', 'bad source: ' + JSON.stringify(r));
      });

      test('pickRate gives up after 5-day window', function () {
        var r = pickRate({ '2026-09-20': 0.9 }, '2026-10-01');
        assert(r === null, 'expected null beyond lookback, got ' + JSON.stringify(r));
      });

      testAsync('fetchEcbRate same-currency needs no network', function () {
        var origFetch = window.fetch;
        var called = 0;
        window.fetch = function () { called++; return Promise.reject(new Error('must not fetch')); };
        function restore() { window.fetch = origFetch; }
        return fetchEcbRate('2026-10-01', 'EUR', 'EUR').then(function (r) {
          restore();
          assert(r.rate === 1 && r.interpolated === false && r.source === '1:1', 'bad 1:1 result: ' + JSON.stringify(r));

          return S.syncDropboxDownload('t', 'f');
        }).then(function () {
          window.fetch = origFetch;
          assert(false, 'other 409 should not download');
        }, function (e) {
          window.fetch = origFetch;
          assert(String((e && e.message) || e).indexOf('refused the request') !== -1, 'bad other-409: ' + ((e && e.message) || e));
        });
      });

      test('sync storage never persists a passphrase', function () {
        var backup = null;
        try { backup = localStorage.getItem('inoculens.sync.v1'); } catch (e) { backup = null; }
        try {
          var cfg = S.syncDefaultConfig();
          cfg.provider = 'webdav';
          cfg.url = 'https://d.test/';
          cfg.password = 'pw';
          cfg.rememberPassword = true;
          S.syncSaveConfig(cfg);
          var raw = '';
          try { raw = localStorage.getItem('inoculens.sync.v1') || ''; } catch (e) { raw = ''; }
          assert(raw.indexOf('passphrase') === -1, 'passphrase key must never persist');
        } finally {
          try {
            if (backup === null) localStorage.removeItem('inoculens.sync.v1');
            else localStorage.setItem('inoculens.sync.v1', backup);
          } catch (e) { /* ignore */ }
        }
      });

      test('settings errors mirror inside the dialog', function () {
        if (typeof init === 'function') init();
        document.getElementById('tb-settings').click();
        var dlg = document.getElementById('settings-dialog');
        assert(dlg && (dlg.open || dlg.hasAttribute('open')), 'settings should be open');
        showBanner('Mirror me', 'error', null);
        var alert = document.getElementById('settings-alert');
        assert(alert && alert.hidden === false, 'alert should show inside settings');
        assert(document.getElementById('settings-alert-text').textContent === 'Mirror me', 'alert text mismatch');
        showBanner('Mirror info', 'info', { title: 'T', lines: ['one'] });
        assert(alert.hidden === false, 'alert should stay visible');
        assert(document.getElementById('settings-alert-details') !== null, 'alert should carry More details');
        clearBanner();
        assert(alert.hidden === true, 'alert should hide with the banner');
        closeDialog('settings-dialog');
      });
    })();

    renderResults();
  </script>
